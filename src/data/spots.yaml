# Posti caldi papabili, da consultare al volo nei giorni chill.
#
# COME AGGIUNGERNE UNO (anche dal telefono, da github.com):
#   copia un blocco qui sotto, cambia i valori. Regole:
#   - `id` unico, minuscolo, con trattini
#   - due soli livelli di indentazione: `- id:` e due spazi per il resto
#   - liste sempre in linea fra parentesi quadre, mai a capo
#   - `coords` sono [latitudine, longitudine] — in Sardegna lat ~39-41, lng ~8-9
#     (se le inverti la build fallisce, non finisce online una cosa sbagliata)
#
# category: spiaggia | caletta | ristorante | bar | vista | attivita
# zone:     alghero | cagliari
# drive:    minuti d'auto dalla base di quella zona
#
# ATTENZIONE: le coordinate qui sotto sono di primo impianto e vanno
# ricontrollate su Maps una per una prima di fidarsene sul posto.

